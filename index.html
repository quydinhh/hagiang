<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f1e8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#19191c" media="(prefers-color-scheme: dark)"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Hà Giang"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><!--hg26:start-->
<title>Hà Giang 3N2Đ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="application/json" id="shared">{}</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap">
<style>
/* Layout: ứng dụng điện thoại — thanh trên dính, nội dung cuộn, 5 tab cố định dưới; tối đa 640px giữa màn hình lớn.
   Phong cách: Oura (DESIGN.md trong thư mục này) — nền giấy kem, chữ mực ấm, xanh rừng làm dải màu, vàng đất cho điểm nhấn,
   xanh dương chỉ cho nút hành động chính; tiêu đề lớn chữ có chân mảnh (Newsreader), chữ đọc Be Vietnam Pro. */
:root{
  --bg:#f7f1e8; --surface:#ffffff; --surface-2:#f1e9dc; --fg:#1c1b1a; --muted:#66625c; --line:#e1dcd3; --line-strong:#cfc8bc;
  --brand:#4a4741; --brand-ink:#ffffff; --brand-soft:#ece5d9;
  --band:#224228; --band-ink:#f7f1e8; --cta:#2a72de; --cta-ink:#ffffff; --bar:#1c1b1a;
  --accent:#af751b; --accent-fg:#684d07; --accent-ink:#ffffff; --accent-soft:#f6ead2;
  --ok:#224228; --ok-soft:#e4e8d8; --warn:#684d07; --warn-soft:#f4e6c6; --bad:#c2301b; --bad-soft:#f9e1da; --move:#5c6f5d; --move-soft:#e8ebe0;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --r:20px; --shadow:0 1px 2px rgba(28,27,26,.05),0 8px 24px rgba(74,71,65,.08);
  --tabbar:64px;
  /* thang chữ: nhãn 12 · phụ 14 · thân 16 · tiêu đề 20 · số tiền 32 · số đếm 40 */
  --fs-cap:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:32px; --fs-2xl:40px;
  --tap:44px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#19191c; --surface:#232220; --surface-2:#2c2a27; --fg:#f7f1e8; --muted:#a8a5a0; --line:#34312d; --line-strong:#4a4741;
  --brand:#f7f1e8; --brand-ink:#4a4741; --brand-soft:#2f2c28;
  --band:#224228; --band-ink:#f7f1e8; --cta:#2a72de; --cta-ink:#ffffff; --bar:#000000;
  --accent:#ddaa61; --accent-fg:#ddbe78; --accent-ink:#39221e; --accent-soft:#33291a;
  --ok:#a9b88f; --ok-soft:#232c20; --warn:#ddbe78; --warn-soft:#33291a; --bad:#f08a74; --bad-soft:#3d1f19; --move:#b4c19b; --move-soft:#262b22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#19191c; --surface:#232220; --surface-2:#2c2a27; --fg:#f7f1e8; --muted:#a8a5a0; --line:#34312d; --line-strong:#4a4741;
  --brand:#f7f1e8; --brand-ink:#4a4741; --brand-soft:#2f2c28;
  --band:#224228; --band-ink:#f7f1e8; --cta:#2a72de; --cta-ink:#ffffff; --bar:#000000;
  --accent:#ddaa61; --accent-fg:#ddbe78; --accent-ink:#39221e; --accent-soft:#33291a;
  --ok:#a9b88f; --ok-soft:#232c20; --warn:#ddbe78; --warn-soft:#33291a; --bad:#f08a74; --bad-soft:#3d1f19; --move:#b4c19b; --move-soft:#262b22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* thanh trên */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .name{font-weight:700;font-size:17px;letter-spacing:.01em}
.topbar .sub{font-size:12px;opacity:.85}
.topbar .clock{font-variant-numeric:tabular-nums;font-weight:600;font-size:20px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:8px}

/* nội dung */
.view{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(var(--tabbar) + 20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:6px;min-width:0}
.notice{border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.info{background:var(--move-soft);color:var(--move)}
.notice b{font-weight:700}

/* nút */
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px;font-weight:500;font-size:14px;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none;line-height:1.2;min-height:36px}
.btn.sm{padding:5px 10px;font-size:13px;min-height:30px;border-radius:8px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.link{appearance:none;border:0;background:none;color:var(--brand);font-weight:600;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 8px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* nhãn ưu tiên */
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.badge.must{background:var(--bad-soft);color:var(--bad)}
.badge.pref{background:var(--accent-soft);color:var(--accent)}
.badge.opt{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge.check{background:var(--warn-soft);color:var(--warn)}
.badge.move{background:var(--move-soft);color:var(--move)}
.badge.rest,.badge.eat{background:var(--ok-soft);color:var(--ok)}
.badge.code{background:var(--surface-2);color:var(--muted);border:1px solid var(--line);font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:500}

/* dòng chặng */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.step:first-child{border-top:0}
.step-time{display:flex;flex-direction:column;align-items:flex-start;font-variant-numeric:tabular-nums;padding-top:2px}
.step-time b{font-size:16px;font-weight:700}
.step-time span{font-size:12px;color:var(--muted)}
.step-time .rail{width:3px;flex:1;min-height:14px;margin:6px 0 0 0;border-radius:2px;background:var(--line)}
.step.must .rail{background:var(--bad)}.step.pref .rail{background:var(--accent)}.step.check .rail{background:var(--warn)}.step.move .rail{background:var(--move)}.step.rest .rail,.step.eat .rail{background:var(--ok)}.step.opt .rail{background:var(--line-strong)}
.step-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.step-head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.step .place{font-weight:600;font-size:15px}
.step .what{font-size:14px}
.step.done .place,.step.done .what,.step.cut .place,.step.cut .what{color:var(--muted);text-decoration:line-through}
.step.cut .rail{background:var(--line)}
.step.now{background:linear-gradient(90deg,var(--accent-soft),transparent 70%);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:10px}
.step-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:30px;height:30px;font-size:18px;cursor:pointer;line-height:1}
.stepper input{width:48px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;padding:4px 2px;background:var(--surface-2);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;min-height:30px}
.chk input{width:18px;height:18px;accent-color:var(--brand);margin:0}
details.sub{font-size:13px}
details.sub summary{cursor:pointer;color:var(--brand);font-weight:500;list-style:none;display:inline-flex;gap:4px;align-items:center}
details.sub summary::-webkit-details-marker{display:none}
details.sub summary::before{content:"▸";font-size:11px;transition:transform .15s}
details.sub[open] summary::before{transform:rotate(90deg)}
details.sub>*:not(summary){margin-top:6px}
textarea.note{width:100%;min-height:54px;border:1px solid var(--line-strong);border-radius:8px;padding:8px;background:var(--surface);resize:vertical}
input[type="time"],input[type="datetime-local"],input[type="url"],input[type="text"],select.sel{border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;background:var(--surface);min-height:34px}
input[type="number"].amt{width:118px;border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;background:var(--surface);text-align:right;font-variant-numeric:tabular-nums;min-height:34px}

/* hôm nay */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.hero h2{font-size:22px;font-weight:700}
.hero .big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hero .route{font-size:13px;opacity:.9}
.nowcard{border:2px solid var(--accent);background:var(--surface)}
.nowcard .label{color:var(--accent)}
.nowcard h3{font-size:19px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi.ok .v{color:var(--ok)}.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:0}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:44px;padding-top:2px}
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--brand);border-radius:999px}

/* chi phí */
.cost{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.cost:first-child{border-top:0}
.cost .nm{font-weight:500}
.cost .calc{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cost .calc input{width:96px;min-height:28px;padding:3px 6px;font-size:13px}
.cost .amt-b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cost .ins{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.cost .ins label{display:inline-flex;align-items:center;gap:4px}
.cost .ins input{width:104px;min-height:28px;padding:3px 6px;font-size:13px}
.cost .nt{grid-column:1/-1;font-size:12px;color:var(--muted)}
.cost.hl .amt-b{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .k{font-size:11px;color:var(--muted)}
.tile.brand{background:var(--brand-soft)}.tile.brand .v{color:var(--brand)}
.tile.accent{background:var(--accent-soft)}.tile.accent .v{color:var(--accent)}
h3.grp{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}

/* thêm */
details.sect{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sect>summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.sect>summary::-webkit-details-marker{display:none}
details.sect>summary::after{content:"+";font-weight:400;font-size:22px;color:var(--muted);line-height:1}
details.sect[open]>summary::after{content:"–"}
details.sect>.in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mapimg{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block}
.place .nm{font-weight:600}
.place .meta{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv b{font-weight:500;color:var(--muted)}
textarea.io{width:100%;min-height:96px;border:1px solid var(--line-strong);border-radius:8px;padding:8px;background:var(--surface);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.srcs a{word-break:break-all}

/* tab dưới */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar)}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;padding:0 2px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--brand)}
.tabbar button .dot{position:relative}
.tabbar button .dot::after{content:"";position:absolute;top:-2px;right:-6px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:14px;font-size:13px;font-weight:500;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:min(90vw,560px);text-align:center}
.toast.show{opacity:1}
/* ---- v3: giao diện gọn theo vai trò ---- */
.row.between{justify-content:space-between}
.k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.k.acc{color:var(--accent)}
.h2{font-size:19px;font-weight:700}
.hero h2{font-size:21px;font-weight:700;text-wrap:pretty}
.hero-k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero-big{font-size:42px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hero-s{font-size:14px;opacity:.9}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.pill.ok,.pill.bad{background:var(--surface-2)}
.pill.ok::before,.pill.bad::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.pill.bad::before{background:var(--bad)}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}
.hero .pill{background:rgba(255,255,255,.18);color:inherit}
.hero .pill.ok::before{background:#8be3ad}.hero .pill.bad::before{background:#ff9d93}
.tl{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.tt{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;padding-top:1px}
.tb{min-width:0;display:flex;flex-direction:column;gap:2px;padding-left:10px;border-left:3px solid var(--line-strong)}
.trow.must .tb{border-left-color:var(--bad)}.trow.pref .tb{border-left-color:var(--accent)}.trow.check .tb{border-left-color:var(--warn)}
.trow.move .tb{border-left-color:var(--move)}.trow.rest .tb,.trow.eat .tb{border-left-color:var(--ok)}
.tp{font-weight:600;font-size:15px;line-height:1.3}
.tw{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tn{font-size:13px;color:var(--brand);font-weight:500}
.ta{display:flex;gap:6px;align-items:center}
.trow.cut .tp{color:var(--muted);text-decoration:line-through;font-weight:500}
.trow.cut .tb{border-left-color:var(--line)}
.trow.done .tp{color:var(--muted)}
.trow.now{background:var(--accent-soft);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);vertical-align:2px;text-decoration:none}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);display:inline-grid;place-items:center;color:var(--brand);cursor:pointer;text-decoration:none;padding:0;flex:none;font-size:20px;line-height:1}
.ibtn.sm{width:30px;height:30px}

/* ---------- dữ liệu trên máy ---------- */
function clone(v){ return v == null ? v : JSON.parse(JSON.stringify(v)); }
function load(){
  let o = {}; try { o = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  const s = Object.assign({}, DEF, o);
  for (const k of SHARED_KEYS) s[k] = o[k] == null ? clone(DEF[k]) : o[k];
  s.dirtyKeys = Object.assign({}, o.dirtyKeys || {}); s.mine = Object.assign({}, o.mine || {}); s.open = Object.assign({}, o.open || {});
  if (s.tab === 'chiphi') s.tab = 'quy'; if (s.tab === 'viec') s.tab = 'them';
  // máy đã dùng app trước khi có bước duyệt: có tên thì vào luôn, chưa có tên thì nhập tên là vào (kho xác nhận lại khi có mạng)

}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function save(){
  planCache = {}; let changed = false;
  for (const k of SHARED_KEYS) { const s = JSON.stringify(S[k]); if (s !== keySig[k]) { if (canWrite(k)) { S.dirtyKeys[k] = true; changed = true; } keySig[k] = s; } }
  persist(); if (changed) schedulePush();
}
function readShared(){ try { const el = document.getElementById('shared'); const o = JSON.parse((el && el.textContent) || '{}'); return o && typeof o === 'object' && typeof o.savedAt === 'string' ? o : {}; } catch (e) { return {}; } }
// 'newer': chỉ nhập khi bản nhóm mới hơn; 'always': nhập luôn; 'force': nhập và bỏ cả thay đổi chưa đẩy
function importShared(mode){
  if (!SHARED || !SHARED.savedAt) return false;
  if (mode === 'newer' && S.sharedAt && S.sharedAt >= SHARED.savedAt) return false;
  if (mode === 'force') S.dirtyKeys = {};

/* ---------- vai trò ---------- */
function isAdmin(){ return CFG.syncUrl ? !!S.pin : !ART_RO; }
function isKeeper(){ return !!(CFG.syncUrl && S.dev && S.dev.id && META.keeper === S.dev.id); }
function canMoney(){ return isAdmin() || isKeeper(); }
function canWrite(k){ return isAdmin() || (isKeeper() && MONEY_KEYS.indexOf(k) >= 0); }
function roleName(){ return isAdmin() ? 'Quản trị' : isKeeper() ? 'Thủ quỹ' : 'Thành viên'; }
function gated(){ return !!CFG.syncUrl && !(S.dev && S.dev.name && S.access === 'ok'); }
function devId(){
  if (!S.dev || !S.dev.id) {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const rnd = n => { const a = new Uint8Array(n); if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); return Array.from(a, x => A[x % A.length]).join(''); };

function applyMeta(m){

}
async function gasPost(body){ const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 15000);

function costBudget(c){ const o = S.cost[c.code] || {}; const price = o.price == null || o.price === '' ? c.price : +o.price; return (c.qty || 0) * (c.times || 0) * (price || 0); }
function costCalc(){
  let hg = 0, hn = 0, paid = 0, actual = 0, actualN = 0, remain = 0;
  const rows = D.costs.map(c => { const o = S.cost[c.code] || {}; const price = o.price == null || o.price === '' ? c.price : +o.price; const budget = (c.qty || 0) * (c.times || 0) * (price || 0);
    const p = +o.paid || 0; const a = o.actual == null || o.actual === '' ? null : +o.actual; if (c.scope === 'HG') hg += budget; else hn += budget; paid += p; if (a != null) { actual += a; actualN++; }
    remain += Math.max((a == null ? budget : a) - p, 0); return Object.assign({}, c, {price, budget, paid: p, actual: a}); });
  const k = D.meta.contingency, n = D.meta.people;
  return {rows, hg, hn, hgCont: hg * k, hgTotal: hg * (1 + k), all: (hg + hn) * (1 + k), paid, actual, actualN, remain, n, k};
}
const ownOf = x => x.paidBy && x.paidBy !== 'fund' ? String(x.paidBy) : '';
function members(){ const m = (S.fund || {}).members; return Array.isArray(m) ? m.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim()).slice(0, 12) : []; }
function fundCalc(){
  const total = +((S.fund || {}).total) || 0; let spent = 0, own = 0;
  for (const x of (S.spend || [])) { if (ownOf(x)) own += +x.amount || 0; else spent += +x.amount || 0; }
  const n = members().length || D.meta.people;
  return {total, spent, own, all: spent + own, left: total - spent, n};
}
// chia tiền cuối chuyến: ai cũng góp quỹ bằng nhau (total/n); ai trả riêng thì được tính là đã góp thêm phần đó;
// phần mỗi người phải chịu = tổng chi (quỹ + riêng) / n; chênh lệch dương = được nhận lại từ quỹ còn dư, âm = đưa thêm cho thủ quỹ
function settle(){
  const f = fundCalc(); const names = members(); const extra = []; for (const x of (S.spend || [])) { const o = ownOf(x); if (o && !names.includes(o) && !extra.includes(o)) extra.push(o); }
  const all = names.concat(extra); const share = f.all / f.n, contrib = f.total / f.n;
  const rows = all.map(nm => { const own = (S.spend || []).filter(x => ownOf(x) === nm).reduce((a, x) => a + (+x.amount || 0), 0); return {name: nm, own, net: contrib + own - share}; });
  return Object.assign({rows, share, contrib, names}, f);
}

function clock(){ const n = nowDate(); const el = document.getElementById('clockt'); if (el) el.textContent = z(n.getHours()) + ':' + z(n.getMinutes()); }
function go(tab, ex){ S.tab = tab; if (ex && ex.day) S.day = ex.day === 'hn' ? 'hn' : +ex.day; if (ex && ex.sect) S.open['s-' + ex.sect] = true; persist(); render(); window.scrollTo(0, 0);
  if (ex && ex.sect) { const el = document.querySelector('details[data-sect="' + ex.sect + '"]'); if (el) el.scrollIntoView({block: 'start'}); } }
function copyText(t){ const done = () => toast('Đã chép'); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => toast(t, 4000)); else toast(t, 4000); }
function arm(el, msg){ if (el.dataset.sure) return true; el.dataset.sure = '1'; el.classList.add('armed'); toast(msg, 3000); setTimeout(() => { if (el.isConnected) { delete el.dataset.sure; el.classList.remove('armed'); } }, 4000); return false; }
function rowOf(day, key){ return schedule(day).rows.find(r => r.key === key); }

view.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return;
  const a = el.dataset.act;
  if (a === 'day') { S.day = el.dataset.day === 'hn' ? 'hn' : +el.dataset.day; persist(); render(); }
  else if (a === 'goto') go(el.dataset.tab, el.dataset);
  else if (a === 'edit') { const k = el.dataset.key; if (S.open[k]) delete S.open[k]; else S.open[k] = true; persist(); render(); }
  else if (a === 'min') { const r = rowOf(+el.dataset.day, el.dataset.key); if (!r) return; S.mins[r.key] = Math.max(0, r.min + +el.dataset.d); save(); render(); }
  else if (a === 'now') { const d = +el.dataset.day; const sc = schedule(d); const r = rowOf(d, el.dataset.key); if (!r) return; const nm = curMin(nowDate()); S.starts[d] = fmtT(nm - (r.begin - sc.start)); save(); render(); toast(nice(r.place) + ' bắt đầu ' + fmtT(nm)); }
  else if (a === 'startnow') { S.starts[+el.dataset.day] = fmtT(curMin(nowDate())); save(); render(); }
  else if (a === 'donenext') { const d = +el.dataset.day; const sc = schedule(d); const r = rowOf(d, el.dataset.key); if (!r) return; S.done = Object.assign({}, S.done, {[r.key]: true});
    const nx = sc.rows.filter(x => x.min > 0).find(x => x.begin >= r.end); const nm = curMin(nowDate());
    if (nx) { S.starts[d] = fmtT(nm - (nx.begin - sc.start)); save(); render(); toast(nice(nx.place) + ' bắt đầu ' + fmtT(nm)); } else { save(); render(); toast('Đã xong ' + nice(r.place)); } }
  else if (a === 'resetday') { if (!arm(el, 'Bấm lần nữa để về giờ gốc')) return; const d = +el.dataset.day; delete S.starts[d]; for (const k of Object.keys(S.mins)) if (k.startsWith(d + '-') || (d === 3 && k.startsWith('m'))) delete S.mins[k]; if (S.choice) delete S.choice[d]; if (S.auto) delete S.auto[d]; save(); render(); toast('Đã về giờ gốc ngày ' + d); }
  else if (a === 'auto') { const d = +el.dataset.day; S.auto = Object.assign({}, S.auto); S.auto[d] = S.auto[d] === false ? true : false; if (S.auto[d]) delete S.auto[d]; save(); render(); }
  else if (a === 'choice') { const d = +el.dataset.day; S.choice = Object.assign({}, S.choice); if (el.dataset.v) S.choice[d] = el.dataset.v; else delete S.choice[d]; save(); render(); }
  else if (a === 'copy') copyText(el.dataset.text);
  else if (a === 'ph-tpl') { PH.tpl = el.dataset.tpl; if (!TPL[PH.tpl].variants.some(v => v[0] === PH.variant)) PH.variant = TPL[PH.tpl].variants[0][0]; PH.slots = PH.slots.slice(0, TPL[PH.tpl].slots.length); PH.sel = null; render(); }
  else if (a === 'ph-var') { PH.variant = el.dataset.var; render(); }
  else if (a === 'ph-rm') { const i = +el.dataset.i; PH.slots.splice(i, 1); PH.sel = null; render(); }
  else if (a === 'ph-clear') { PH.slots = []; PH.sel = null; PH.out = null; render(); }
  else if (a === 'ph-sel') { const i = +el.dataset.i; if (PH.sel == null) PH.sel = i; else if (PH.sel === i) PH.sel = null; else { [PH.slots[PH.sel], PH.slots[i]] = [PH.slots[i], PH.slots[PH.sel]]; PH.sel = null; toast('Đã đổi chỗ'); } render(); }
  else if (a === 'ph-share') photoShare(el);
  else if (a === 'sharelink') { const url = location.origin + location.pathname; const data = {title: 'Hà Giang 3N2Đ', text: 'Lịch trình Hà Giang 06–08/11 của nhóm mình', url}; if (navigator.share) navigator.share(data).catch(() => {}); else copyText(url); }
  else if (a === 'share') { if (SYNC.kind === 'gas') gasSave(el); else artifactSave(el); }
  else if (a === 'pull') gasLoad(true);
  else if (a === 'grant') adminAct('grant', el.dataset.dev || '');
  else if (a === 'approve') adminAct('approve', el.dataset.dev);
  else if (a === 'rmdev') { if (el.dataset.sure) adminAct('remove', el.dataset.dev); else { el.dataset.sure = '1'; el.classList.add('warn'); toast('Bấm × lần nữa để xóa ' + devLabel(el.dataset.dev)); } }
  else if (a === 'expand') { const row = el.closest('.trow'); const k = el.dataset.key; if (EXPANDED.has(k)) EXPANDED.delete(k); else EXPANDED.add(k); if (row) row.classList.toggle('open', EXPANDED.has(k)); el.setAttribute('aria-expanded', String(EXPANDED.has(k))); }
  else if (a === 'gatecheck') gasLoad(true);
  else if (a === 'gaterename') { S.access = 'rename'; persist(); render(); }
  else if (a === 'spq') { document.getElementById('sp-item').value = el.dataset.t; document.getElementById('sp-code').value = el.dataset.c || ''; document.getElementById('sp-amt').focus(); }
  else if (a === 'spby') { document.getElementById('sp-by').value = el.dataset.by; for (const c of document.querySelectorAll('#sp-bychips .chip')) c.classList.toggle('on', c === el); }
  else if (a === 'memdel') { const m = members().filter(x => x !== el.dataset.name); S.fund = Object.assign({}, S.fund, {members: m}); save(); render(); }
  else if (a === 'memdev') { const m = members(); for (const d of Object.values(META.devices || {})) { const nm = (d.name || '').trim(); if (nm && !m.includes(nm) && m.length < 12) m.push(nm); } S.fund = Object.assign({}, S.fund, {members: m}); save(); render(); toast('Đã thêm ' + m.length + ' thành viên'); }
  else if (a === 'spdel') { if (el.dataset.sure) { S.spend = (S.spend || []).filter(x => String(x.id) !== el.dataset.id); save(); render(); toast('Đã xóa khoản chi'); } else { el.dataset.sure = '1'; el.classList.add('warn'); toast('Bấm × lần nữa để xóa'); } }
  else if (a === 'hintoff') { S.hintOff = true; persist(); render(); }
  else if (a === 'install') { if (installEvt) { installEvt.prompt(); installEvt.userChoice.then(() => { installEvt = null; render(); }); } }
  else if (a === 'export') { const t = JSON.stringify(S); const ta = document.getElementById('io'); if (ta) ta.value = t; copyText(t); }
  else if (a === 'import') { const ta = document.getElementById('io'); if (!ta || !ta.value.trim()) { toast('Dán JSON sao lưu vào ô bên dưới trước'); return; } if (!arm(el, 'Bấm lần nữa để khôi phục')) return; try { const o = JSON.parse(ta.value); if (!o || typeof o !== 'object') throw 0; for (const k of SHARED_KEYS) if (o[k] != null) S[k] = clone(o[k]); save(); render(); toast('Đã khôi phục'); } catch (err) { toast('JSON không hợp lệ, dán lại đủ bản sao lưu'); } }
  else if (a === 'reimport') { if (!arm(el, 'Bấm lần nữa · bỏ thay đổi chưa lưu')) return; importShared('force'); render(); toast('Đã nhập lại bản nhóm'); }
  else if (a === 'clear') { if (el.dataset.sure) { const keep = {dev: S.dev, pin: S.pin}; try { localStorage.removeItem(KEY); } catch (err) {} S = load(); Object.assign(S, keep); for (const k of SHARED_KEYS) keySig[k] = JSON.stringify(S[k]); importShared('force'); render(); toast('Đã xóa dữ liệu trên máy'); } else { el.dataset.sure = '1'; el.textContent = 'Bấm lần nữa để xóa'; const hEl = document.getElementById('clear-hint'); if (hEl) hEl.textContent = 'Không hoàn tác được.'; } }
  else if (a === 'fakeclear') { S.fakeNow = null; persist(); render(); clock(); }
});
view.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); } });
view.addEventListener('change', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act;
  if (a === 'done') { S.done = Object.assign({}, S.done, {[el.dataset.key]: el.checked}); save(); render(); }
  else if (a === 'minset') { S.mins[el.dataset.key] = Math.max(0, Math.round(+el.value || 0)); save(); render(); }
  else if (a === 'start') { if (/^\d{2}:\d{2}$/.test(el.value)) { S.starts = Object.assign({}, S.starts, {[+el.dataset.day]: el.value}); save(); render(); } }
  else if (a === 'check') { S.checks = Object.assign({}, S.checks, {[el.dataset.code]: el.checked}); save(); render(); }
  else if (a === 'svc') { S.svc = Object.assign({}, S.svc, {[el.dataset.code]: el.value}); save(); render(); }
  else if (a === 'mine') { S.mine[el.dataset.id] = el.checked; persist(); render(); }
  else if (a === 'pin') { const v = el.value.trim(); const pins = Object.assign({}, S.pins); if (!v) delete pins[el.dataset.code]; else if (/^https?:\/\//.test(v)) pins[el.dataset.code] = v; else { toast('Link phải bắt đầu bằng https://'); return; } S.pins = pins; save(); render(); }
  else if (a === 'fund') { const v = digitsOf(el.value); S.fund = Object.assign({}, S.fund, {total: v || null}); save(); render(); }
  else if (a === 'fakenow') { S.fakeNow = el.value || null; persist(); clock(); render(); }
  else if (a === 'pincode') { const v = el.value.trim(); if (v) S.pin = v; else delete S.pin; persist(); planCache = {}; toast(v ? 'Đã lưu PIN · máy này là quản trị' : 'Đã xóa PIN'); render(); if (v) gasLoad(false); }
  else if (a === 'ph-file') { photoFiles(el.files); el.value = ''; }
  else if (a === 'devname') { const v = el.value.trim().slice(0, 40); if (!v) { el.value = S.dev.name || ''; toast('Tên không được để trống'); return; } devId(); S.dev.name = v; persist(); registerDevice().then(() => renderSoon()); toast('Đã lưu tên'); }
});
view.addEventListener('input', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act;
  if (a === 'money' || a === 'fund') { const n = digitsOf(el.value); const f = n ? groupDigits(n) : ''; if (el.value !== f) el.value = f; }
  if (a === 'ph-cap' || a === 'ph-sub') { PH[a === 'ph-cap' ? 'caption' : 'sub'] = el.value; clearTimeout(PH.t); PH.t = setTimeout(drawPreview, 250); return; }
  if (a === 'note') { const notes = Object.assign({}, S.notes); const v = el.value; if (v.trim()) notes[el.dataset.key] = v; else delete notes[el.dataset.key]; S.notes = notes; save(); }
  else if (a === 'cost') { const c = el.dataset.code, f = el.dataset.f; const cost = clone(S.cost) || {}; cost[c] = cost[c] || {}; const blank = el.value.trim() === ''; const n = digitsOf(el.value); cost[c][f] = blank ? '' : n; const fm = blank ? '' : groupDigits(n); if (el.value !== fm) el.value = fm; S.cost = cost; save();
    const cc = costCalc(); const sumEl = document.getElementById('cost-summary'); if (sumEl) sumEl.innerHTML = costSummary(cc); const r = cc.rows.find(x => x.code === c); const b = view.querySelector('[data-budget="' + c + '"]'); if (b && r) b.textContent = money(r.budget); }
});
view.addEventListener('submit', e => {
  if (e.target.id === 'gateform') { e.preventDefault(); gateSubmit(); return; }
  if (e.target.id === 'memform') { e.preventDefault(); const inp = document.getElementById('mem-name'); const nm = inp.value.trim().slice(0, 20); if (!nm) return; const m = members(); if (m.includes(nm)) { toast('Đã có tên này'); return; } if (m.length >= 12) { toast('Tối đa 12 người'); return; } m.push(nm); S.fund = Object.assign({}, S.fund, {members: m}); save(); render(); toast('Đã thêm ' + nm); return; }
  if (e.target.id !== 'spendform') return; e.preventDefault();
  const item = document.getElementById('sp-item').value.trim(); const amount = digitsOf(document.getElementById('sp-amt').value); const code = document.getElementById('sp-code').value; const by = (document.getElementById('sp-by') || {}).value || 'fund';
  if (!item || !(amount > 0)) { toast('Nhập nội dung và số tiền'); return; }
  S.spend = (S.spend || []).concat([{id: Date.now(), at: new Date().toISOString(), item, amount, code: code || undefined, paidBy: by === 'fund' ? undefined : by, by: S.dev && S.dev.id}]); save(); render(); toast('Đã ghi ' + money(amount) + (by !== 'fund' ? ' · ' + by + ' trả' : ''));
});
view.addEventListener('toggle', e => { const d = e.target; if (!d || d.tagName !== 'DETAILS') return; const id = d.dataset.sect ? 's-' + d.dataset.sect : d.dataset.open; if (!id) return; if (d.open) S.open[id] = true; else delete S.open[id]; persist(); }, true);
view.addEventListener('focusout', () => { if (SYNC.needRender) setTimeout(() => { if (SYNC.needRender && !editing()) render(); }, 300); });
tabsEl.addEventListener('click', e => { const b = e.target.closest('[data-act="tab"]'); if (b) go(b.dataset.tab); });
const clockEl = document.getElementById('clock'); if (clockEl) clockEl.addEventListener('click', () => { toast(statusText(), 3500); if (SYNC.kind === 'gas') gasLoad(false); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.tab === 'homnay' || S.tab === 'them') renderSoon(); });
window.addEventListener('online', () => { SYNC.state = 'idle'; paintStatus(); syncTick(); });
window.addEventListener('offline', () => { SYNC.state = 'offline'; paintStatus(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { clock(); syncTick(); } });
setInterval(syncTick, POLL_MS);
setInterval(() => { if (SYNC.kind === 'gas' && S.access === 'pending' && navigator.onLine && document.visibilityState === 'visible') gasLoad(false); }, 15000);

const hashTab = (location.hash || '').slice(1); if (TABS.some(t => t[0] === hashTab) || hashTab === 'anh') S.tab = hashTab;
clock(); render(); initSync();
if (importedShared) toast('Đã nhập dữ liệu nhóm lúc ' + fmtHM(new Date(SHARED.savedAt)));
setInterval(() => { clock(); if ((S.tab === 'homnay' || S.tab === 'lich' || SYNC.needRender) && !editing()) render(); }, 30000);
})();

</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  const had = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.register('./sw.js').then(reg => { try { reg.update(); } catch (e) {} }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded) { reloaded = true; location.reload(); } });
}
</script>
